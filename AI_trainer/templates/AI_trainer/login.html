<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .login-container h2 {
            margin-bottom: 20px;
        }
        .error {
            color: red;
        }
        .countdown {
            color: red;
            font-weight: bold;
        }
    </style>
    <script>
        let lockTime = {{ lock_time|default:0 }};
        function startCountdown() {
            const countdownElement = document.getElementById('countdown');
            if (lockTime > 0) {
                const interval = setInterval(() => {
                    lockTime--;
                    countdownElement.innerText = `Please wait ${lockTime} seconds.`;
                    if (lockTime <= 0) {
                        clearInterval(interval);
                        countdownElement.innerText = '';
                        document.getElementById('email').disabled = false;
                        document.getElementById('password').disabled = false;
                    }
                }, 1000);
            } else {
                countdownElement.innerText = '';
            }
        }
        window.onload = startCountdown;
    </script>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
        <div id="countdown" class="countdown"></div>
        <form method="POST">
            {% csrf_token %}
            <input type="email" id="email" name="email" placeholder="Email" required {% if lock_time > 0 %}disabled{% endif %}><br><br>
            <input type="password" id="password" name="password" placeholder="Password" required {% if lock_time > 0 %}disabled{% endif %}><br><br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
